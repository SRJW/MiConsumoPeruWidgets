name: Build MiConsumoPeru IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Unsigned Archive
        run: |
          xcodebuild clean archive \
            -project MiTelcelWidget.xcodeproj \
            -scheme MiTelcelApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MiConsumoPeru.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/MiConsumoPeru.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r MiConsumoPeru-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiConsumoPeru-Unsigned-IPA
          path: ${{ runner.temp }}/MiConsumoPeru-Unsigned.ipa
